# DPS-guided rectified-flow inference.
# CUDA_VISIBLE_DEVICES=0 python mar_pnp_rf.py --config config/MAR_pnp_rf.yaml

# Model
model_name: JiT-B/16
image_size: 512
in_channels: 1
model_path: ./model/checkpoint-step0200000.pth
seed: 20260818

# Full time grid; init_t=0.5 executes 200 Heun intervals to t=1.
num_steps: 400
sampling_method: heun
guidance_scale: 10.0
guidance_schedule: linear
start_guidance_at: 0.05
max_zeta: 4.0
noise_scale: 1.0
grad_mode: full
init_mode: xli_blend
init_t: 0.5

# High-risk regions: gradient refinement. Low-risk regions: sinogram replacement.
final_refine_mode: hybrid_mask
final_mask_dilate: 5
hybrid_mask_mode: projection_augmented
hybrid_proj_dilate: 3
hybrid_proj_threshold: 0.3
save_hybrid_mask: false
final_dc_steps: 200
final_dc_eta: 0.01

# Included 512x512 images and 720x721 sinograms
data_path: ./test_data/oral_ct
inner_dir: test_720geo/
num_test_image: 1
num_test_mask: 10
save_dir: ./test_results_dps_rf
